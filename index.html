<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Konwerter plików</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#d9dde3;--ac:#2563eb;--ac-tx:#fff;--ok:#15803d;--er:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14161a;--card:#1d2026;--tx:#eceff3;--mut:#9aa3b2;--bd:#323741;--ac:#5b8def;--ac-tx:#0b0f17;--ok:#4ade80;--er:#f87171}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14161a;--card:#1d2026;--tx:#eceff3;--mut:#9aa3b2;--bd:#323741;--ac:#5b8def;--ac-tx:#0b0f17;--ok:#4ade80;--er:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 2px}
p.sub{margin:0 0 14px;color:var(--mut);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
#drop{border:2px dashed var(--bd);border-radius:14px;padding:28px 12px;text-align:center;cursor:pointer;color:var(--mut)}
#drop.over{border-color:var(--ac);color:var(--ac)}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
select,input[type=range]{width:100%}
select{padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem}
button{font:inherit;padding:11px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.pri{background:var(--ac);color:var(--ac-tx);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd)}
li:first-child{border-top:0}
.nm{flex:1;min-width:0;overflow-wrap:anywhere;font-size:.92rem}
.st{font-size:.8rem;color:var(--mut)}
.st.ok{color:var(--ok)}.st.er{color:var(--er)}
li button{padding:6px 10px;font-size:.85rem;flex:none}
#note{font-size:.82rem;color:var(--mut);margin:8px 0 0}
</style>
</head>
<body>
<main>
<h1>Konwerter plików</h1>
<p class="sub">Masowa konwersja w przeglądarce — pliki nie opuszczają Twojego urządzenia.</p>

<div id="drop" class="card" tabindex="0">Dotknij lub upuść pliki tutaj<br><small>dane · dokumenty · obrazy · audio · wideo</small></div>
<input id="inp" type="file" multiple hidden>

<div class="card">
  <label for="fmt">Format docelowy</label>
  <select id="fmt">
    <optgroup label="Dane">
      <option value="json">JSON</option>
      <option value="csv">CSV</option>
      <option value="tsv">TSV (zapis jako .txt)</option>
      <option value="md">Markdown (tabela)</option>
      <option value="html">HTML (tabela)</option>
      <option value="xlsx">Excel (XLSX)</option>
      <option value="xml">XML</option>
      <option value="yaml">YAML</option>
    </optgroup>
    <optgroup label="Obrazy">
      <option value="jpg">JPG</option>
      <option value="png">PNG</option>
      <option value="webp">WEBP</option>
      <option value="ipdf">PDF (z obrazu)</option>
    </optgroup>
    <optgroup label="Dokumenty (DOCX, MD, HTML, TXT)">
      <option value="dtxt">Tekst (.txt)</option>
      <option value="dhtml">Dokument HTML</option>
      <option value="pdf">PDF (z Excela, CSV, JSON, DOCX, tekstu, obrazu)</option>
    </optgroup>
    <optgroup label="Audio (z MP3, WAV, OGG, M4A, MP4...)">
      <option value="mp3">MP3</option>
      <option value="wav">WAV</option>
    </optgroup>
    <optgroup label="Wideo (MP4, WebM, MOV; czas rzeczywisty)">
      <option value="mp4">MP4</option>
      <option value="webm">WebM</option>
    </optgroup>
  </select>
  <div id="qwrap" style="margin-top:12px;display:none">
    <label for="q">Jakość: <span id="qv">90</span>%</label>
    <input id="q" type="range" min="10" max="100" value="90">
  </div>
  <div id="mwrap" style="margin-top:12px;display:none">
    <label for="mw">Maks. szerokość obrazu w px (puste = bez zmian)</label>
    <input id="mw" type="number" min="16" max="10000" placeholder="np. 1280" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit">
  </div>
</div>

<div class="card">
  <div class="row">
    <button id="go" class="pri" disabled>Konwertuj</button>
    <button id="zip" disabled>Pobierz ZIP</button>
    <button id="clr" disabled>Wyczyść</button>
  </div>
  <ul id="list"></ul>
  <p id="note"></p>
</div>
</main>

<script>
(function(){
var DATA_IN=['json','csv','tsv','txt','xml','yaml','yml','xlsx','xls','ods'], IMG_IN=['jpg','jpeg','png','webp','bmp','gif','svg'];
var DATA_OUT=['json','csv','tsv','md','html'], IMG_OUT={jpg:'image/jpeg',png:'image/png',webp:'image/webp'};
var items=[], dl=null;
var $=function(id){return document.getElementById(id)};
var fmt=$('fmt'), list=$('list');

function ext(n){var m=/\.([^.]+)$/.exec(n);return m?m[1].toLowerCase():''}
function base(n){return n.replace(/\.[^.]+$/,'')}

/* ---------- dane ---------- */
function parseCSV(t,d){
  var rows=[],r=[],f='',q=false,i=0,c;
  t=t.replace(/^\uFEFF/,'');
  for(;i<t.length;i++){
    c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"') q=true;
    else if(c===d){r.push(f);f=''}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n')i++; r.push(f);f='';rows.push(r);r=[] }
    else f+=c;
  }
  if(f!==''||r.length){r.push(f);rows.push(r)}
  return rows.filter(function(x){return x.length>1||x[0]!==''});
}
function coerce(v){
  if(v==='')return v;
  if(v==='true')return true; if(v==='false')return false;
  return /^-?\d+(\.\d+)?$/.test(v)&&isFinite(v)?Number(v):v;
}
function toRows(text,e){
  if(e==='json'){
    var j=JSON.parse(text);
    if(!Array.isArray(j))j=[j];
    return j.map(function(x){return (x&&typeof x==='object'&&!Array.isArray(x))?x:{value:x}});
  }
  var first=text.split(/\r?\n/)[0]||'';
  var d=(e==='tsv'||(first.indexOf('\t')>-1&&first.indexOf(',')<0))?'\t':',';
  var p=parseCSV(text,d);
  if(!p.length)return [];
  var h=p[0];
  return p.slice(1).map(function(r){var o={};h.forEach(function(k,i){o[k]=coerce(r[i]===undefined?'':r[i])});return o});
}
function keysOf(rows){var s=[],seen={};rows.forEach(function(r){Object.keys(r).forEach(function(k){if(!seen[k]){seen[k]=1;s.push(k)}})});return s}
function cell(v){return v===null||v===undefined?'':(typeof v==='object'?JSON.stringify(v):String(v))}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fromRows(rows,out){
  var k=keysOf(rows);
  if(out==='json')return JSON.stringify(rows,null,2);
  if(out==='csv'||out==='tsv'){
    var d=out==='csv'?',':'\t';
    var f=function(v){var s=cell(v);return (s.indexOf(d)>-1||/["\n\r]/.test(s))?'"'+s.replace(/"/g,'""')+'"':s};
    return [k.map(f).join(d)].concat(rows.map(function(r){return k.map(function(x){return f(r[x])}).join(d)})).join('\n')+'\n';
  }
  if(out==='md'){
    var m=function(v){return cell(v).replace(/\|/g,'\\|').replace(/\n/g,' ')};
    return '| '+k.map(m).join(' | ')+' |\n| '+k.map(function(){return '---'}).join(' | ')+' |\n'+
      rows.map(function(r){return '| '+k.map(function(x){return m(r[x])}).join(' | ')+' |'}).join('\n')+'\n';
  }
  return '<!DOCTYPE html>\n<html><head><meta charset="utf-8"><title>Tabela</title></head><body>\n<table border="1" cellpadding="4">\n<tr>'+
    k.map(function(x){return '<th>'+esc(x)+'</th>'}).join('')+'</tr>\n'+
    rows.map(function(r){return '<tr>'+k.map(function(x){return '<td>'+esc(cell(r[x]))+'</td>'}).join('')+'</tr>'}).join('\n')+'\n</table>\n</body></html>\n';
}
function outExt(o){return o==='tsv'||o==='dtxt'?'txt':o==='dhtml'?'html':o==='ipdf'?'pdf':o}

/* ---------- obrazy ---------- */
function convImage(file,out,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var w=img.naturalWidth||1024,h=img.naturalHeight||1024,mw=+$('mw').value||0;
      if(mw&&w>mw){h=Math.round(h*mw/w);w=mw}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      var x=c.getContext('2d');
      if(out==='jpg'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}
      x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej(new Error('format nieobsługiwany w tej przeglądarce'))},IMG_OUT[out],q/100);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('nie można odczytać obrazu'))};
    img.src=url;
  });
}

/* ---------- dokumenty ---------- */
var DOC_IN=['docx','md','html','htm','txt'], DOC_OUT={dtxt:1,dhtml:1,pdf:1};
var AUD_IN=['mp3','wav','ogg','m4a','flac','aac','opus','weba'], VID_IN=['mp4','webm','mov','ogv','m4v'];
var MEDIA_OUT={mp3:1,wav:1,mp4:1,webm:1};
var OK_SAVE=['gif','png','jpg','jpeg','webp','mp4','webm','mov','txt','json','md','docx','pptx','epub','csv','html','svg','pdf','xlsx','zip'];
function inl(s){return s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>')}
function md2html(t){
  return esc(t).split(/\n{2,}/).map(function(b){
    var m=/^(#{1,6})\s+(.*)$/.exec(b.trim());
    return m?'<h'+m[1].length+'>'+inl(m[2])+'</h'+m[1].length+'>':'<p>'+inl(b).replace(/\n/g,'<br>')+'</p>';
  }).join('\n');
}
async function getDoc(file,e){
  if(e==='docx'){
    if(!window.mammoth)throw new Error('brak biblioteki DOCX');
    var ab=await file.arrayBuffer();
    return {html:(await mammoth.convertToHtml({arrayBuffer:ab})).value,text:(await mammoth.extractRawText({arrayBuffer:ab})).value};
  }
  var raw=await file.text();
  if(e==='md')return {html:md2html(raw),text:raw};
  if(e==='html'||e==='htm')return {html:raw,text:new DOMParser().parseFromString(raw,'text/html').body.textContent.trim()};
  return {html:'<p>'+esc(raw).split(/\n{2,}/).join('</p><p>')+'</p>',text:raw};
}
function textToPdf(text){
  if(!window.jspdf)throw new Error('brak biblioteki PDF');
  var W=1240,H=1754,M=100,LH=38,c=document.createElement('canvas');c.width=W;c.height=H;
  var x=c.getContext('2d');x.font='26px sans-serif';
  var lines=[];
  text.split('\n').forEach(function(p){
    var cur='';
    p.split(/\s+/).forEach(function(w){
      var t=cur?cur+' '+w:w;
      if(x.measureText(t).width>W-2*M&&cur){lines.push(cur);cur=w}else cur=t;
    });
    lines.push(cur);
  });
  var per=Math.floor((H-2*M)/LH),doc=new jspdf.jsPDF({unit:'mm',format:'a4'});
  for(var p=0;p*per<lines.length;p++){
    x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#000';x.font='26px sans-serif';
    lines.slice(p*per,(p+1)*per).forEach(function(l,i){x.fillText(l,M,M+LH*(i+1))});
    if(p)doc.addPage();
    doc.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);
  }
  return doc.output('blob');
}
async function convDoc(it,e,out){
  if(out==='pdf'&&TAB_IN.indexOf(e)>-1)return tablePdf(it.file,e);
  if(out==='pdf'&&IMG_IN.indexOf(e)>-1)return imgToPdf(it.file);
  if(DOC_IN.indexOf(e)<0)throw new Error('to nie jest dokument (DOCX, MD, HTML, TXT)');
  var d=await getDoc(it.file,e);
  if(out==='dtxt')return new Blob([d.text],{type:'text/plain'});
  if(out==='dhtml')return new Blob(['<!DOCTYPE html>\n<html><head><meta charset="utf-8"><title>'+esc(base(it.file.name))+'</title></head><body>\n'+d.html+'\n</body></html>'],{type:'text/html'});
  return textToPdf(d.text);
}

/* ---------- audio / wideo ---------- */
function wavBlob(buf){
  var ch=Math.min(2,buf.numberOfChannels),n=buf.length,ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab);
  function s(o,t){for(var i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))}
  s(0,'RIFF');v.setUint32(4,36+n*ch*2,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);
  v.setUint16(22,ch,true);v.setUint32(24,buf.sampleRate,true);v.setUint32(28,buf.sampleRate*ch*2,true);
  v.setUint16(32,ch*2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,n*ch*2,true);
  var d=[],o=44,i,c;for(c=0;c<ch;c++)d.push(buf.getChannelData(c));
  for(i=0;i<n;i++)for(c=0;c<ch;c++){var x=Math.max(-1,Math.min(1,d[c][i]));v.setInt16(o,x<0?x*32768:x*32767,true);o+=2}
  return new Blob([ab],{type:'audio/wav'});
}
function toI16(f){var o=new Int16Array(f.length);for(var i=0;i<f.length;i++){var x=Math.max(-1,Math.min(1,f[i]));o[i]=x<0?x*32768:x*32767}return o}
function mp3Blob(buf){
  if(!window.lamejs)throw new Error('brak biblioteki MP3');
  var ch=Math.min(2,buf.numberOfChannels),enc=new lamejs.Mp3Encoder(ch,buf.sampleRate,128),
      L=toI16(buf.getChannelData(0)),R=ch>1?toI16(buf.getChannelData(1)):null,parts=[],a,i;
  for(i=0;i<L.length;i+=1152){
    a=ch>1?enc.encodeBuffer(L.subarray(i,i+1152),R.subarray(i,i+1152)):enc.encodeBuffer(L.subarray(i,i+1152));
    if(a.length)parts.push(new Uint8Array(a));
  }
  a=enc.flush();if(a.length)parts.push(new Uint8Array(a));
  return new Blob(parts,{type:'audio/mpeg'});
}
function convVideo(it,out){
  return new Promise(function(res,rej){
    var types=out==='mp4'?['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4']:['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    var mime=types.filter(function(t){return window.MediaRecorder&&MediaRecorder.isTypeSupported(t)})[0];
    if(!mime)return rej(new Error('ta przeglądarka nie nagrywa formatu '+out.toUpperCase()));
    var url=URL.createObjectURL(it.file),v=document.createElement('video');
    v.src=url;v.playsInline=true;v.preload='auto';
    v.onerror=function(){URL.revokeObjectURL(url);rej(new Error('przeglądarka nie odtwarza tego pliku'))};
    v.onloadedmetadata=function(){
      var ac=new (window.AudioContext||window.webkitAudioContext)(),dest=ac.createMediaStreamDestination();
      ac.resume();ac.createMediaElementSource(v).connect(dest);
      v.play().then(function(){
        var vs=v.captureStream?v.captureStream():v.mozCaptureStream();
        var st=new MediaStream(vs.getVideoTracks().concat(dest.stream.getAudioTracks()));
        var rec=new MediaRecorder(st,{mimeType:mime}),ch=[];
        rec.ondataavailable=function(e){if(e.data.size)ch.push(e.data)};
        rec.onstop=function(){URL.revokeObjectURL(url);ac.close();res(new Blob(ch,{type:mime.split(';')[0]}))};
        v.ontimeupdate=function(){it.msg='nagrywanie '+Math.round(100*v.currentTime/v.duration)+'%';render()};
        v.onended=function(){rec.stop()};
        rec.start(500);
      }).catch(function(){rej(new Error('odtwarzanie zablokowane przez przeglądarkę'))});
    };
  });
}
async function convMedia(it,e,out){
  if(out==='mp3'||out==='wav'){
    if(AUD_IN.concat(VID_IN).indexOf(e)<0)throw new Error('format źródłowy nieobsługiwany w przeglądarce');
    var ac=new (window.AudioContext||window.webkitAudioContext)(),buf;
    try{buf=await ac.decodeAudioData(await it.file.arrayBuffer())}
    catch(x){throw new Error('przeglądarka nie odczytała dźwięku')}
    ac.close();
    return out==='wav'?wavBlob(buf):mp3Blob(buf);
  }
  if(VID_IN.indexOf(e)<0)throw new Error('wideo: źródło MP4, WebM, MOV lub OGV');
  return convVideo(it,out);
}

/* ---------- XML / YAML / XLSX / obraz->PDF ---------- */
function xmlRows(t){
  var d=new DOMParser().parseFromString(t,'application/xml');
  if(d.getElementsByTagName('parsererror').length)throw new Error('niepoprawny XML');
  var root=d.documentElement,kids=[].slice.call(root.children);
  var items=(kids.length&&kids.every(function(k){return k.tagName===kids[0].tagName}))?kids:[root];
  return items.map(function(el){
    var o={};
    [].forEach.call(el.attributes,function(a){o['@'+a.name]=coerce(a.value)});
    var ch=[].slice.call(el.children);
    if(!ch.length){var tx=el.textContent.trim();if(tx||!Object.keys(o).length)o.value=coerce(tx);return o}
    ch.forEach(function(c){o[c.tagName]=c.children.length?c.textContent.trim():coerce(c.textContent.trim())});
    return o;
  });
}
function yv(s){
  s=s.trim();
  if(/^".*"$/.test(s)){try{return JSON.parse(s)}catch(e){}}
  if(/^'.*'$/.test(s))return s.slice(1,-1).replace(/''/g,"'");
  if(s==='null'||s==='~')return '';
  return coerce(s);
}
function yamlRows(t){
  var rows=[],cur=null;
  t.split(/\r?\n/).forEach(function(l){
    if(!l.trim()||/^\s*#/.test(l)||/^---/.test(l))return;
    var m=/^(\s*)(-\s+)?([^:#]+?):\s*(.*)$/.exec(l);
    if(!m){var sc=/^\s*-\s+(.*)$/.exec(l);if(sc)rows.push({value:yv(sc[1])});return}
    if(m[2]||!cur){cur={};rows.push(cur)}
    cur[m[3].trim()]=yv(m[4]);
  });
  return rows;
}
async function getRows(file,e){
  if(['xlsx','xls','ods'].indexOf(e)>-1){
    if(!window.XLSX)throw new Error('brak biblioteki XLSX');
    var wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  }
  var t=await file.text();
  if(e==='xml')return xmlRows(t);
  if(e==='yaml'||e==='yml')return yamlRows(t);
  return toRows(t,e);
}
function tag(k){k=String(k).replace(/[^\w.-]/g,'_');return /^[A-Za-z_]/.test(k)?k:'_'+k}
function toXml(rows){
  var k=keysOf(rows);
  return '<?xml version="1.0" encoding="UTF-8"?>\n<rows>\n'+rows.map(function(r){
    return '  <row>\n'+k.filter(function(x){return r[x]!==undefined}).map(function(x){
      return '    <'+tag(x)+'>'+esc(cell(r[x]))+'</'+tag(x)+'>';
    }).join('\n')+'\n  </row>';
  }).join('\n')+'\n</rows>\n';
}
function ys(v){
  if(typeof v==='number'||typeof v==='boolean')return String(v);
  var s=cell(v);
  return (s===''||/^\s|\s$|[:#\[\]{},&*!|>'"%@`\n]/.test(s)||coerce(s)!==s||s==='null'||s==='~')?JSON.stringify(s):s;
}
function toYaml(rows){
  var k=keysOf(rows);
  return rows.map(function(r){
    return k.filter(function(x){return r[x]!==undefined}).map(function(x,i){return (i?'  ':'- ')+ys(x)+': '+ys(r[x])}).join('\n');
  }).join('\n')+'\n';
}
function xlsxBlob(rows){
  if(!window.XLSX)throw new Error('brak biblioteki XLSX');
  var flat=rows.map(function(r){var o={};Object.keys(r).forEach(function(k){var v=r[k];o[k]=(v&&typeof v==='object')?JSON.stringify(v):v});return o});
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(flat),'Arkusz1');
  return new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function imgToPdf(file){
  if(!window.jspdf)throw new Error('brak biblioteki PDF');
  var jb=await convImage(file,'jpg',+$('q').value);
  var url=await new Promise(function(r){var fr=new FileReader();fr.onload=function(){r(fr.result)};fr.readAsDataURL(jb)});
  var dim=await new Promise(function(r){var im=new Image();im.onload=function(){r([im.naturalWidth,im.naturalHeight])};im.src=url});
  var w=dim[0]*0.75,h=dim[1]*0.75;
  var doc=new jspdf.jsPDF({unit:'pt',format:[w,h],orientation:w>h?'l':'p'});
  doc.addImage(url,'JPEG',0,0,w,h);
  return doc.output('blob');
}

/* ---------- tabele (Excel itd.) -> PDF ---------- */
var TAB_IN=['xlsx','xls','ods','csv','tsv','json'];
async function tablePdf(file,e){
  if(!window.jspdf)throw new Error('brak biblioteki PDF');
  var sheets=[];
  if(['xlsx','xls','ods'].indexOf(e)>-1){
    if(!window.XLSX)throw new Error('brak biblioteki XLSX');
    var wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    wb.SheetNames.forEach(function(n){
      sheets.push({name:n,aoa:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false})});
    });
  }else{
    var rows=await getRows(file,e),k=keysOf(rows);
    sheets.push({name:base(file.name),aoa:[k].concat(rows.map(function(r){return k.map(function(x){return cell(r[x])})}))});
  }
  var W=1754,H=1240,M=70,RH=38,F='22px sans-serif',FB='bold 22px sans-serif';
  var cv=document.createElement('canvas');cv.width=W;cv.height=H;
  var x=cv.getContext('2d'),pages=[];
  function fit(t,w){
    t=String(t).replace(/\s+/g,' ');
    if(x.measureText(t).width<=w-16)return t;
    while(t.length>1&&x.measureText(t+'…').width>w-16)t=t.slice(0,-1);
    return t+'…';
  }
  sheets.forEach(function(sh){
    var aoa=sh.aoa.filter(function(r){return r.some(function(c){return String(c).trim()!==''})});
    if(!aoa.length)return;
    var nc=Math.max.apply(null,aoa.map(function(r){return r.length})),ws=[],c,i;
    x.font=F;
    for(c=0;c<nc;c++){
      var mx=60;
      aoa.slice(0,200).forEach(function(r){mx=Math.max(mx,x.measureText(String(r[c]===undefined?'':r[c]).slice(0,60)).width+24)});
      ws.push(Math.min(mx,420));
    }
    var groups=[],g=[],gw=0;
    for(c=0;c<nc;c++){
      if(g.length&&gw+ws[c]>W-2*M){groups.push(g);g=[];gw=0}
      g.push(c);gw+=ws[c];
    }
    if(g.length)groups.push(g);
    var per=Math.floor((H-2*M)/RH)-2,body=aoa.slice(1);
    groups.forEach(function(cols,gi){
      for(var s=0;s===0||s<body.length;s+=per){
        x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#000';x.strokeStyle='#999';x.lineWidth=1;
        x.font=FB;x.fillText(sh.name+(groups.length>1?' (część '+(gi+1)+'/'+groups.length+')':''),M,M);
        var list=[aoa[0]].concat(body.slice(s,s+per));
        list.forEach(function(r,ri){
          var y=M+RH*(ri+1),px=M;
          x.font=ri===0?FB:F;
          cols.forEach(function(cc){
            if(ri===0){x.fillStyle='#e6e9ee';x.fillRect(px,y,ws[cc],RH);x.fillStyle='#000'}
            x.strokeRect(px,y,ws[cc],RH);
            x.fillText(fit(r[cc]===undefined?'':r[cc],ws[cc]),px+8,y+RH-11);
            px+=ws[cc];
          });
        });
        pages.push(cv.toDataURL('image/jpeg',0.88));
        if(pages.length>400)throw new Error('zbyt wiele stron (ponad 400)');
        if(!body.length)break;
      }
    });
  });
  if(!pages.length)throw new Error('pusty plik');
  var doc=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:'l'});
  pages.forEach(function(p,i){if(i)doc.addPage();doc.addImage(p,'JPEG',0,0,297,210)});
  return doc.output('blob');
}

/* ---------- logika ---------- */
async function convertOne(it){
  var e=ext(it.file.name), out=fmt.value, isImg=!!IMG_OUT[out];
  it.blob=null;
  try{
    if(MEDIA_OUT[out]||DOC_OUT[out]){
      it.blob=await (MEDIA_OUT[out]?convMedia:convDoc)(it,e,out);
    }else if(isImg||out==='ipdf'){
      if(IMG_IN.indexOf(e)<0)throw new Error('to nie jest obraz');
      it.blob=out==='ipdf'?await imgToPdf(it.file):await convImage(it.file,out,+$('q').value);
    }else{
      if(DATA_IN.indexOf(e)<0)throw new Error('obraz nie zamieni się w dane');
      var rows=await getRows(it.file,e);
      it.blob=out==='xlsx'?xlsxBlob(rows):new Blob([out==='xml'?toXml(rows):out==='yaml'?toYaml(rows):fromRows(rows,out)],{type:'text/plain'});
    }
    it.out=base(it.file.name)+'.'+outExt(out);
    it.msg='gotowe ('+Math.max(1,Math.round(it.blob.size/1024))+' KB)';it.cls='ok';
  }catch(err){it.msg='błąd: '+err.message;it.cls='er'}
}
async function saveBlob(name,blob){
  var note=$('note');
  if(dl){
    try{await dl.save({filename:name,data:blob});note.textContent='Zapisano: '+name;return}
    catch(e){
      var c=e&&e.code;
      if(c==='declined'){note.textContent='';return}
      if(c==='rejected_extension'){note.textContent='Format .'+ext(name)+' można pobrać tylko w pliku ZIP.';return}
      if(c==='host_unavailable'){note.textContent='Ta aplikacja nie zapisuje plików. Otwórz stronę w przeglądarce na komputerze.';return}
      if(['unavailable','not_granted','capability_disabled','capability_removed'].indexOf(c)<0){note.textContent='Błąd zapisu: '+((e&&e.message)||c);return}
    }
  }
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},5000);
  note.textContent='Pobieranie: '+name;
}
function render(){
  list.textContent='';
  items.forEach(function(it,i){
    var li=document.createElement('li');
    var n=document.createElement('div');n.className='nm';n.textContent=it.out||it.file.name;
    var s=document.createElement('span');s.className='st '+(it.cls||'');s.textContent=it.msg||'oczekuje';
    li.appendChild(n);li.appendChild(s);
    if(it.blob){
      if(!dl||OK_SAVE.indexOf(ext(it.out))>-1){
        var b=document.createElement('button');b.textContent='Pobierz';
        b.onclick=function(){saveBlob(it.out,it.blob)};
        li.appendChild(b);
      }else{
        var z=document.createElement('span');z.className='st';z.textContent='tylko w ZIP';
        li.appendChild(z);
      }
    }
    list.appendChild(li);
  });
  var done=items.filter(function(i){return i.blob}).length;
  $('go').disabled=!items.length;
  $('clr').disabled=!items.length;
  $('zip').disabled=!(done&&window.JSZip);
}
function add(files){
  Array.prototype.forEach.call(files,function(f){items.push({file:f})});
  render();
}
fmt.onchange=function(){
  var v=fmt.value;
  $('qwrap').style.display=(v==='jpg'||v==='webp'||v==='ipdf')?'block':'none';
  $('mwrap').style.display=(v==='jpg'||v==='webp'||v==='png'||v==='ipdf')?'block':'none';
};
$('q').oninput=function(){$('qv').textContent=this.value};
$('go').onclick=async function(){
  this.disabled=true;
  for(var i=0;i<items.length;i++){items[i].msg='konwersja…';items[i].cls='';render();await convertOne(items[i]);render()}
};
$('zip').onclick=async function(){
  var z=new JSZip(),used={};
  items.forEach(function(it){
    if(!it.blob)return;
    var n=it.out;
    if(used[n]){var k=used[n]++;n=base(n)+'_'+k+'.'+ext(n)}else used[n]=1;
    z.file(n,it.blob);
  });
  saveBlob('konwersja.zip',await z.generateAsync({type:'blob'}));
};
$('clr').onclick=function(){items=[];render()};
var drop=$('drop'),inp=$('inp');
drop.onclick=function(){inp.click()};
drop.onkeydown=function(e){if(e.key==='Enter'||e.key===' ')inp.click()};
inp.onchange=function(){add(inp.files);inp.value=''};
['dragover','dragenter'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.add('over')})});
['dragleave','drop'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.remove('over')})});
drop.addEventListener('drop',function(e){add(e.dataTransfer.files)});

if(window.claude&&claude.use){
  claude.use('downloads').then(function(d){dl=d;render()}).catch(function(){dl=null;render()});
}
render();
})();
</script>
